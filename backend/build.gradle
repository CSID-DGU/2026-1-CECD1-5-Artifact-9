plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.artifact'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'
	implementation 'software.amazon.awssdk:s3:2.31.78'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()

	// @SpringBootTest 컨텍스트 4개(각각 Hibernate·Spring Security·AWS SDK·springdoc 포함)가
	// 이 JVM 하나에서 순서대로 뜬다. JVM 기본 힙(물리 메모리의 1/4 추정치)에 맡겨두면
	// CI 러너마다 실제로 잡히는 크기가 달라 어느 조합에서는 마지막 컨텍스트를 띄우다가
	// OutOfMemoryError 로 죽는다 — 실제로 CorsConfigTest 에서 이렇게 CI 가 죽은 적이 있다.
	// 힙을 고정값으로 못박아 두면 러너 사양과 무관하게 항상 같은 양이 보장된다.
	minHeapSize = "512m"
	maxHeapSize = "2g"
}
