# =============================================
# 서버
# =============================================
server.port=8080

# =============================================
# .env 파일 자동 로드 (로컬 실행용)
# - working directory(보통 backend/) 기준 .env 를 properties 형식으로 읽음
# - 파일이 없어도(optional:) 에러 안 남 → 도커 환경에서도 그대로 동작
# =============================================
spring.config.import=optional:file:.env[.properties]

# =============================================
# 파일 업로드 크기 제한
# =============================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =============================================
# MySQL (환경 변수에서 주입 — 도커/로컬 둘 다 동작)
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/artifact_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- DB 커넥션 풀 (HikariCP) ---
# maximum-pool-size: 동시에 열 수 있는 DB 커넥션 수. 이 수를 넘는 요청은 대기한다.
# connection-timeout: 풀이 비었을 때 커넥션을 기다리는 시간(ms). 기본 30초는 너무 길다 —
#   장애가 나면 요청이 30초씩 쌓이기만 하고 원인도 드러나지 않는다. 5초에 끊어 빨리 실패시킨다.
# 애초에 풀이 마르지 않게 하는 것이 본질이라, 외부 API 호출은 트랜잭션 밖에서 한다
#   (AnalysisService.analyze / KioskService.analyze 주석 참고).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# =============================================
# AWS S3
# =============================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# 로컬 개발 시 image.storage.type=local 로 설정하면 AWS S3 대신 로컬 디렉터리에 저장
image.storage.type=${IMAGE_STORAGE_TYPE:s3}
image.local.upload-dir=${IMAGE_LOCAL_UPLOAD_DIR:/tmp/artifact-images}

# =============================================
# 외부 API 호출 공통 (FastAPI / Gemini)
# =============================================
# 응답 없는 서버를 무한정 기다리면 요청 스레드가 그대로 묶인다. 연결 타임아웃은 공용
# HttpClient(HttpClientConfig)에 걸고, 응답 타임아웃은 호출처마다 아래 값으로 지정한다.
http.client.connect-timeout-seconds=${HTTP_CONNECT_TIMEOUT_SECONDS:5}

# =============================================
# FastAPI AI 서버
# =============================================
fastapi.url=${FASTAPI_URL:http://localhost:8000}
# 추론 응답 대기 한도(초). GPU 없이 도는 환경도 있어 Gemini보다 넉넉하게 잡는다.
fastapi.timeout-seconds=${FASTAPI_TIMEOUT_SECONDS:30}
# FastAPI 와 공유하는 내부 호출 시크릿. FastAPI 쪽 INTERNAL_API_SECRET 과 같은 값이어야 한다.
# JWT 서명키와 같은 이유로 기본값을 두지 않는다 — 미설정 시 기동 실패시킨다.
# 값 생성: openssl rand -base64 32
fastapi.internal-secret=${INTERNAL_API_SECRET}

# =============================================
# 키오스크
# =============================================
# QR 없이 "다음 대기 환자"로 자동 진입하는 폴백(/api/kiosk/pending).
# 인증도 토큰도 없이 접근 대상을 알려주는 유일한 경로라 기본은 꺼둔다.
# QR을 못 쓰는 시연에서만 true 로 켠다.
kiosk.auto-pending.enabled=${KIOSK_AUTO_PENDING:false}

# =============================================
# 로깅
# =============================================
# 운영에서는 INFO 로 낮춘다(LOG_LEVEL=INFO). DEBUG 는 요청 본문까지 남기는데
# 여기에는 환자 이름·연락처가 섞여 들어간다 — 로그 파일이 곧 개인정보 파일이 된다.
logging.level.com.artifact=${LOG_LEVEL:DEBUG}

# =============================================
# API 문서 (Swagger)
# =============================================
# Swagger UI 는 전체 엔드포인트 목록과 요청 형식을 그대로 보여준다. 개발에는 필수지만
# 인터넷에 열린 서버에서는 공격자용 설명서다. 운영에서는 SWAGGER_ENABLED=false 로 끈다.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# =============================================
# 처방 커멘트 LLM API 키
# =============================================
gemini.api.key=${GEMINI_API_KEY:}
# 응답 대기 한도(초). AI 코멘트는 없어도 되는 부가 정보라 추론보다 짧게 끊는다.
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:15}
# 사용할 모델. 모델을 갈아끼울 때 코드를 고치지 않도록 설정으로 뺀다.
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# =============================================
# JWT
# =============================================
# 기본값을 두지 않는다 — JWT_SECRET 미설정 시 애플리케이션이 기동 실패해야 한다.
# (기본값이 있으면 공개 저장소의 그 값으로 누구나 토큰을 위조할 수 있다)
# 값 생성: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================
# 초기 관리자 계정 (선택)
# =============================================
# 두 값이 모두 설정된 경우에만 기동 시 ADMIN 계정을 생성한다.
# 비워두면 생성하지 않는다 — 소스에 계정을 박아두지 않기 위한 구조.
admin.bootstrap.login-id=${ADMIN_LOGIN_ID:}
admin.bootstrap.password=${ADMIN_PASSWORD:}

# =============================================
# 의료기관 정보 (제증명 문서 머리말)
# =============================================
# 진단서·처방전 등 법정서식은 의료기관 명칭·주소·전화번호·요양기관번호를 기재해야 한다.
# 환자별 데이터가 아니라 "이 서버가 어느 병원에 설치됐는가"에 대한 설정이라 DB가 아닌 여기에 둔다.
hospital.name=${HOSPITAL_NAME:아티팩트 피부과의원}
hospital.address=${HOSPITAL_ADDRESS:}
hospital.phone=${HOSPITAL_PHONE:}
# 요양기관번호(건강보험 청구용 8자리)
hospital.registration-no=${HOSPITAL_REGISTRATION_NO:}
# 직인 이미지 URL. 비워두면 문서에 '(직인생략)' 으로 표기된다.
hospital.seal-image-url=${HOSPITAL_SEAL_IMAGE_URL:}
