# =============================================
# 서버
# =============================================
server.port=8080

# =============================================
# .env 파일 자동 로드 (로컬 실행용)
# - working directory(보통 backend/) 기준 .env 를 properties 형식으로 읽음
# - 파일이 없어도(optional:) 에러 안 남 → 도커 환경에서도 그대로 동작
# =============================================
spring.config.import=optional:file:.env[.properties]

# =============================================
# 파일 업로드 크기 제한
# =============================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =============================================
# MySQL (환경 변수에서 주입 — 도커/로컬 둘 다 동작)
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/artifact_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================
# AWS S3
# =============================================
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}

# 로컬 개발 시 image.storage.type=local 로 설정하면 AWS S3 대신 로컬 디렉터리에 저장
image.storage.type=${IMAGE_STORAGE_TYPE:s3}
image.local.upload-dir=${IMAGE_LOCAL_UPLOAD_DIR:/tmp/artifact-images}

# =============================================
# FastAPI AI 서버
# =============================================
fastapi.url=${FASTAPI_URL:http://localhost:8000}

# =============================================
# 로깅
# =============================================
logging.level.com.artifact=DEBUG

# =============================================
# 처방 커멘트 LLM API 키
# =============================================
gemini.api.key=${GEMINI_API_KEY:}

# =============================================
# JWT
# =============================================
# 기본값을 두지 않는다 — JWT_SECRET 미설정 시 애플리케이션이 기동 실패해야 한다.
# (기본값이 있으면 공개 저장소의 그 값으로 누구나 토큰을 위조할 수 있다)
# 값 생성: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================
# 초기 관리자 계정 (선택)
# =============================================
# 두 값이 모두 설정된 경우에만 기동 시 ADMIN 계정을 생성한다.
# 비워두면 생성하지 않는다 — 소스에 계정을 박아두지 않기 위한 구조.
admin.bootstrap.login-id=${ADMIN_LOGIN_ID:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
