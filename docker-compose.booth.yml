# =============================================
# Team Artifact — 부스 시연 오버라이드 (AI 워커 ×3 + 로드밸런서)
# =============================================
# 평소에는 쓰지 않는다. 부스 기간에만 **맨 뒤에 한 줄 더 붙여서** 켠다:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.https.yml -f docker-compose.booth.yml up -d --build
#
# 순서가 중요하다 — 이 파일이 가장 뒤여야 backend 의 FASTAPI_URL 을 덮어쓴다.
# 켜기 전에 합쳐진 결과를 눈으로 본다: 위 명령의 up 대신 config.
#
# ---------------------------------------------
# ⚠️ 먼저 인스턴스를 올려야 한다. 순서를 지키지 않으면 오히려 느려진다
# ---------------------------------------------
# 필요 사양: 4 vCPU / 8GB (c7g.xlarge). 워커 3 × 약 700MB + MySQL 400MB + JVM 700MB ≈ 3.3GB
# t4g.small(2 vCPU / 2GB)에서는 **뜨지 않는다** — 스왑으로 밀려 추론 한 건이 십 초 단위가 된다.
#
# ⚠️ 인스턴스 유형 변경 화면에 "무료 플랜 적격 인스턴스 유형만 선택할 수 있습니다" 가 뜨면
# 계정이 무료 플랜이라 c7g 를 아예 고를 수 없다. Billing → 무료 티어 → 유료 플랜으로
# 업그레이드가 선행 조건이다. 절차 전체는 docs/ec2-deployment-guide.md 9단계 "부스 시연".
#
# ---------------------------------------------
# 이게 무엇을 해결하는가 — 처리량이 아니라 공정성이다
# ---------------------------------------------
# FastAPI 는 한 프로세스가 한 번에 하나의 추론만 돌린다. Grad-CAM 이 전역 model 객체에
# hook 을 거는 방식이라 그 구간을 통째로 직렬화해야 하기 때문이다(fastapi/main.py 의
# _model_lock 주석). 그래서 **컨테이너 1개 = 동시 추론 1건**이 구조적 상한이고,
# 두 번째 키오스크가 첫 번째를 기다리는 상황은 워커를 늘리는 것 말고는 없앨 수 없다.
#
# 다만 docs/security-remediation-plan.md 의 실측(직렬 2.31 → 동시4 2.38 req/s, 변화 없음)대로,
# CPU 추론의 총 처리량은 코어 수로 정해지고 워커를 몇 개로 쪼개든 합계는 그대로다.
# 늘어나는 것은 대기의 공정성이다 — 3번째 요청의 대기가 "추론시간 × 3" 에서 "× 1" 이 된다.
#
# 키오스크가 2대로 확정되면 워커도 2개로 줄인다:
# 아래 fastapi3 블록과 docker/ai-lb/nginx.conf 의 upstream 한 줄을 함께 지운다.
# 남는 워커 하나는 메모리만 먹고 하는 일이 없다.
# =============================================

# 워커 3개가 완전히 같은 설정을 쓴다. 한 곳만 고쳐도 나머지가 따라오도록 앵커로 묶는다.
# (`x-` 로 시작하는 최상위 키는 compose 가 무시한다 — 서비스로 뜨지 않는다)
x-ai-worker: &ai-worker
  build:
    context: ./fastapi
    dockerfile: Dockerfile
  # 세 서비스가 같은 태그를 공유하므로 이미지는 하나만 남고, 2·3번 빌드는 전부 캐시 히트다.
  # 태그를 지정하지 않으면 compose 가 서비스명으로 이미지를 3개 만든다(내용은 같은데 태그만 셋).
  image: artifact-fastapi:booth
  restart: unless-stopped
  environment:
    LOW_CONFIDENCE_THRESHOLD: ${LOW_CONFIDENCE_THRESHOLD:-0.45}
    INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET이 설정되지 않았습니다. .env.example을 참고해 .env에 추가하세요.}
    # ── 스레드 수 ──────────────────────────────────────────────────
    # 워커가 3개인데 각자 코어를 전부 잡으려 들면 서로를 밀어낸다.
    # 4 vCPU 기준 2로 시작한다:
    #   1 → 키오스크 한 대만 쓸 때 지금보다 **느려진다** (코어 4개 중 1개만 쓴다)
    #   4 → 3대가 동시에 쓰면 12스레드가 4코어를 놓고 싸운다 (컨텍스트 스위칭 비용)
    #   2 → 동시 2대에서 4코어를 정확히 채우고, 3대일 때만 가볍게 초과한다
    # 부하 테스트 결과를 보고 이 값만 고친다. 다른 곳은 건드릴 필요 없다.
    #
    # 두 개를 모두 주는 이유: OMP_NUM_THREADS 는 OpenMP 런타임이 **라이브러리 로드 시점에**
    # 읽으므로 파이썬 코드로는 늦을 수 있고, TORCH_NUM_THREADS 는 main.py 가 읽어
    # torch.set_num_threads 로 넘긴다. 둘 다 같은 값이어야 한다.
    #
    # 이 값이 booth 파일에만 있는 이유: 워커가 1개인 평소에는 코어를 전부 쓰는 게 맞다.
    # 기본 파일에 넣어두면 t4g.small 단독 운영에서 오히려 절반만 쓰게 된다.
    OMP_NUM_THREADS: "2"
    TORCH_NUM_THREADS: "2"
  healthcheck:
    test: ["CMD", "python", "-c",
           "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 60s
  networks:
    - artifact-network

services:

  fastapi:
    # 기본 파일의 fastapi 위에 앵커를 덮어쓴다. container_name(artifact-fastapi)은
    # 기본 파일 것이 그대로 남는다 — 기존 문서의 `docker exec artifact-fastapi ...` 가 계속 산다.
    <<: *ai-worker

  fastapi2:
    <<: *ai-worker
    container_name: artifact-fastapi2

  fastapi3:
    <<: *ai-worker
    container_name: artifact-fastapi3

  ai-lb:
    # 설정 파일 하나만 얹으면 되는 순수 프록시라 별도 Dockerfile 을 만들지 않는다.
    image: nginx:1.27-alpine
    container_name: artifact-ai-lb
    restart: unless-stopped
    volumes:
      # :ro — 컨테이너가 이 파일을 고칠 이유가 없다.
      # 설정을 바꾼 뒤에는 재시작해야 반영된다: docker compose ... restart ai-lb
      - ./docker/ai-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # service_healthy 가 아니라 service_started 다. nginx 는 upstream 의 호스트명을
      # **설정 로드 시점에** 해석하므로 컨테이너가 아직 없으면 기동 자체가 실패한다.
      # 즉 여기서 필요한 것은 "컨테이너가 존재할 것"까지이고, 그건 started 로 충분하다.
      #
      # healthy 까지 기다리게 하면 워커 하나가 끝내 못 뜰 때 ai-lb 도 영영 안 뜬다 —
      # 워커 2개로 굴러가면 될 상황에서 AI 경로 전체가 죽는다. 부스에서는 그쪽이 더 나쁘다.
      # 아직 모델을 읽는 중인 워커는 max_fails/fail_timeout 이 잠깐 빼뒀다가 되돌린다.
      fastapi:
        condition: service_started
      fastapi2:
        condition: service_started
      fastapi3:
        condition: service_started
    # 호스트에 열지 않는다. backend 만 도커 내부 네트워크로 접근한다.
    # (FastAPI 를 직접 열지 않는 것과 같은 이유 — 그 앞에 선 이 컨테이너도 마찬가지다)
    expose:
      - "8000"
    networks:
      - artifact-network

  backend:
    environment:
      # AI 호출을 워커 하나(fastapi:8000)가 아니라 로드밸런서로 보낸다.
      # **이 한 줄이 위의 워커 3개를 실제로 연결한다.** 자바 코드는 건드리지 않는다 —
      # 주소가 이미 application.properties 의 ${FASTAPI_URL} 로 외부화돼 있다.
      #
      # 이 줄만 빠지면 워커 3개와 ai-lb 가 멀쩡히 떠 있는데도 요청은 전부 1번 워커로만
      # 간다. 컨테이너가 다 Up 이라 겉으로는 정상으로 보이므로 특히 조심할 것.
      # 확인: docker compose ... exec backend env | grep FASTAPI_URL
      FASTAPI_URL: http://ai-lb:8000
