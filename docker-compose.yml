# =============================================
# Team Artifact - 로컬 개발 환경
# MySQL + Spring Boot + FastAPI 묶음 정의
# =============================================

services:

  # -------------------------------------------
  # MySQL 8.0 데이터베이스
  # -------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: artifact-mysql
    restart: unless-stopped
    environment:
      # 기본값을 두지 않는다. 예전의 `:-rootpass` 는 .env 에 DB_PASSWORD 를 비워두기만 해도
      # 공개 저장소에 적힌 그 값으로 조용히 넘어갔다 — JWT 서명키와 똑같은 함정이 한 층 아래에
      # 남아 있던 셈이다. 아래 3306 포트와 겹치면 "인터넷에 열린 DB + 공개된 비밀번호"가 된다.
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD가 설정되지 않았습니다. .env.example을 참고해 .env에 추가하세요.}
      MYSQL_DATABASE: artifact_db
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # 로컬에서 DB 도구로 직접 붙어보기 위한 포트. 운영(EC2)에서는 절대 열지 않는다 —
    # docker-compose.prod.yml 이 이 항목을 지운다.
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artifact-network

  # -------------------------------------------
  # FastAPI AI 추론 서버
  # -------------------------------------------
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: artifact-fastapi
    restart: unless-stopped
    environment:
      MIN_TOP1_CONFIDENCE: ${MIN_TOP1_CONFIDENCE:-0.45}
      # 백엔드와 공유하는 내부 호출 시크릿. 아래 backend 에도 같은 값이 들어간다.
      # 미설정 시 FastAPI 가 기동을 거부한다(main.py 상단) — 무방비로 뜨는 것보다 안 뜨는 게 낫다.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET이 설정되지 않았습니다. .env.example을 참고해 .env에 추가하세요.}
    # ports 를 두지 않는다 — FastAPI에는 인증이 없어서 호스트에 열면 누구나 추론 엔드포인트를
    # 직접 호출하게 된다. backend 는 같은 네트워크에서 http://fastapi:8000 으로 접근하므로 문제없다.
    # (같은 네트워크 안에서의 무단 호출은 위 INTERNAL_API_SECRET 헤더가 막는다.)
    # 로컬에서 직접 찔러봐야 할 때만 아래를 임시로 켠다(외부에 열리지 않도록 127.0.0.1 바인딩).
    #   ports:
    #     - "127.0.0.1:8000:8000"
    networks:
      - artifact-network

  # -------------------------------------------
  # Spring Boot 백엔드
  # -------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artifact-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy # MySQL이 완전히 켜진 후에 Spring 시작
    environment:
      # Spring → MySQL 연결 (컨테이너끼리 통신은 서비스명 'mysql'로)
      DB_URL: jdbc:mysql://mysql:3306/artifact_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      # AWS S3 (.env에서 읽음)
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-local-dev-access-key}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-local-dev-secret-key}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-local-dev-bucket}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      # 로컬 이미지 저장 (.env에서 읽음, 기본값 local)
      IMAGE_STORAGE_TYPE: ${IMAGE_STORAGE_TYPE:-local}
      IMAGE_LOCAL_UPLOAD_DIR: /app/artifact-images

      FASTAPI_URL: http://fastapi:8000
      # 위 fastapi 컨테이너와 같은 값이어야 한다. 다르면 추론 호출이 401로 거절된다.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

      # QR 없이 "다음 대기 환자"로 자동 진입하는 폴백. 토큰 없이 접근 대상을 알려주므로 기본은 꺼둔다.
      KIOSK_AUTO_PENDING: ${KIOSK_AUTO_PENDING:-false}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # JWT 서명키 — 기본값 없음. 미설정 시 compose가 즉시 중단된다.
      # 값 생성: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET이 설정되지 않았습니다. .env.example을 참고해 .env에 추가하세요.}

      # 초기 관리자 계정 (선택). 비워두면 ADMIN 계정을 만들지 않는다.
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      TZ: Asia/Seoul
    volumes:
      - artifact-images:/app/artifact-images
    # 로컬에서 Swagger(:8080/swagger-ui)와 curl 로 직접 찔러보기 위한 포트.
    # 운영에서는 nginx(frontend)가 /api/ 를 프록시하므로 필요 없다 — prod 오버라이드가 지운다.
    ports:
      - "8080:8080"
    networks:
      - artifact-network

  # -------------------------------------------
  # React + nginx 프론트엔드
  # -------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artifact-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - artifact-network

# -------------------------------------------
# 영구 저장 볼륨 (컨테이너 지워져도 DB 데이터 유지)
# -------------------------------------------
volumes:
  mysql-data:
  artifact-images:

# -------------------------------------------
# 컨테이너 간 통신용 가상 네트워크
# -------------------------------------------
networks:
  artifact-network:
    driver: bridge
