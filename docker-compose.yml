# =============================================
# Team Artifact - 로컬 개발 환경
# MySQL + Spring Boot + FastAPI 묶음 정의
# =============================================

services:

  # -------------------------------------------
  # MySQL 8.0 데이터베이스
  # -------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: artifact-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: artifact_db
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artifact-network

  # -------------------------------------------
  # FastAPI AI 추론 서버
  # -------------------------------------------
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: artifact-fastapi
    restart: unless-stopped
    environment:
      MIN_TOP1_CONFIDENCE: ${MIN_TOP1_CONFIDENCE:-0.45}
    ports:
      - "8000:8000"
    networks:
      - artifact-network

  # -------------------------------------------
  # Spring Boot 백엔드
  # -------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artifact-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy # MySQL이 완전히 켜진 후에 Spring 시작
    environment:
      # Spring → MySQL 연결 (컨테이너끼리 통신은 서비스명 'mysql'로)
      DB_URL: jdbc:mysql://mysql:3306/artifact_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}

      # AWS S3 (.env에서 읽음)
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-local-dev-access-key}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-local-dev-secret-key}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-local-dev-bucket}
      AWS_REGION: ${AWS_REGION:-us-east-1}

      # 로컬 이미지 저장 (.env에서 읽음, 기본값 local)
      IMAGE_STORAGE_TYPE: ${IMAGE_STORAGE_TYPE:-local}
      IMAGE_LOCAL_UPLOAD_DIR: /app/artifact-images

      FASTAPI_URL: http://fastapi:8000

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # JWT 서명키 — 기본값 없음. 미설정 시 compose가 즉시 중단된다.
      # 값 생성: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET이 설정되지 않았습니다. .env.example을 참고해 .env에 추가하세요.}

      # 초기 관리자 계정 (선택). 비워두면 ADMIN 계정을 만들지 않는다.
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      TZ: Asia/Seoul
    volumes:
      - artifact-images:/app/artifact-images
    ports:
      - "8080:8080"
    networks:
      - artifact-network

  # -------------------------------------------
  # React + nginx 프론트엔드
  # -------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artifact-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - artifact-network

# -------------------------------------------
# 영구 저장 볼륨 (컨테이너 지워져도 DB 데이터 유지)
# -------------------------------------------
volumes:
  mysql-data:
  artifact-images:

# -------------------------------------------
# 컨테이너 간 통신용 가상 네트워크
# -------------------------------------------
networks:
  artifact-network:
    driver: bridge
