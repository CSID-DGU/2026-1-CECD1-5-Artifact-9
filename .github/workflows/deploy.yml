# =============================================
# CD — main 에 들어간 코드를 EC2 에 자동 배포
# =============================================
# 지금까지 손으로 하던 것과 똑같은 일을 한다:
#   ssh → cd ~/artifact → git pull → docker compose up -d --build
#
# 다른 점은 "누가" 하느냐다. EC2 안에서 도는 self-hosted 러너가 GitHub 에
# 일감을 물어보고(outbound), 있으면 실행한다. 그래서 22번 포트를 인터넷에
# 열 필요가 없다 — 자세한 이유는 docs/cicd-guide.md 2-0 참고.
# =============================================
name: Deploy

on:
  push:
    branches: [main]
  # 콘솔에서 손으로도 돌릴 수 있게 (배포 실패 후 재시도용)
  workflow_dispatch:

# 배포는 절대 동시에 돌면 안 된다. 두 개가 겹치면 빌드 중인 이미지를
# 다른 실행이 갈아엎는다. cancel-in-progress 를 false 로 두어
# 앞 배포가 끝날 때까지 기다리게 한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: EC2 배포
    # 2단계에서 등록할 러너의 라벨. 라벨이 안 맞으면 job 이 영원히 대기한다.
    runs-on: [self-hosted, artifact-prod]

    steps:
      # ⚠️ actions/checkout 을 쓰지 않는다. 일부러다.
      #
      # checkout 은 러너 작업폴더(~/actions-runner/_work/...)에 코드를 푼다.
      # 거기서 compose 를 실행하면 **프로젝트 이름이 폴더명에서 나오기 때문에**
      # 볼륨 이름이 artifact_mysql-data 가 아니라 다른 이름이 된다.
      # → 빈 DB 가 새로 생기고, 환자 데이터가 사라진 것처럼 보인다.
      #
      # 그래서 기존 배포 폴더(~/artifact)를 그대로 쓴다.
      - name: 최신 코드 받기
        run: |
          cd ~/artifact
          git fetch origin main
          # 이 커밋으로 정확히 맞춘다. origin/main 을 쓰면 그 사이 들어온
          # 다른 커밋까지 딸려와 "무엇이 배포됐는지" 가 흐려진다.
          git reset --hard ${{ github.sha }}
          echo "배포 대상: $(git log --oneline -1)"

      # -------------------------------------------
      # 스키마 마이그레이션은 여기서 하지 않는다 — Flyway 가 한다.
      # -------------------------------------------
      # 예전에는 이 자리에서 docker/mysql/init/*.sql 을 손으로 골라 실행했다.
      # MySQL 의 docker-entrypoint-initdb.d 는 데이터 볼륨이 비어 있을 때만 돌기 때문에,
      # 운영처럼 이미 데이터가 있는 DB 에는 나중에 추가된 테이블이 영영 안 생겼기 때문이다.
      # 그 방식은 "배포에 파일을 덧붙이는 것을 사람이 기억해야 한다" 는 게 약점이었다.
      #
      # 지금은 backend/src/main/resources/db/migration 의 V*.sql 이 jar 에 실려 가고,
      # 백엔드가 뜰 때 Flyway 가 flyway_schema_history 를 보고 안 돌린 것만 적용한다.
      # 그 뒤 ddl-auto=validate 가 엔티티와 실제 테이블을 대조하므로,
      # 마이그레이션을 빠뜨린 배포는 헬스체크까지 가지 못하고 여기서 멈춘다.

      # 부스 기간(2026-11-16~)에는 AI 워커 여러 개 + 로드밸런서 구성을 덧붙인다(docker-compose.booth.yml).
      # 저장소 변수 BOOTH_MODE 로 켜고 끈다 — 서버에 SSH 하지 않고 GitHub 화면에서 바꿀 수 있고, 부스 중에 누가
      # main 에 머지해도 평소 구성으로 조용히 되돌아가지 않는다. 바꾼 뒤에는 이 워크플로를 수동 실행해 적용한다.
      # --remove-orphans 는 부스를 끌 때 남는 fastapi2·ai-lb 를 지운다(지금 파일들에 없는 서비스만 지운다).
      - name: 빌드 · 재기동
        run: |
          cd ~/artifact
          FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.https.yml"
          if [ "${{ vars.BOOTH_MODE }}" = "true" ]; then
            FILES="$FILES -f docker-compose.booth.yml"
            echo "부스 구성으로 배포 (BOOTH_MODE=true)"
          fi
          echo "COMPOSE_FILES=$FILES" >> "$GITHUB_ENV"
          docker compose $FILES up -d --build --remove-orphans

          # ai-lb 는 설정 파일 하나를 볼륨으로 얹어 쓴다. 파일만 바뀌면 compose 는 컨테이너를 다시 만들지 않고,
          # git 이 파일을 새로 쓰면(새 inode) 떠 있는 컨테이너는 옛 파일을 계속 본다 — nginx -s reload 로는 바뀐
          # 설정이 읽히지 않는다(로컬에서 확인). 그래서 일회용 컨테이너로 새 설정의 문법을 먼저 보고, 맞을 때만
          # ai-lb 를 다시 시작해 새 파일을 얹는다. 틀리면 여기서 멈추고 돌던 ai-lb 는 그대로 둔다.
          if [ "${{ vars.BOOTH_MODE }}" = "true" ]; then
            docker compose $FILES run --rm --no-deps -T ai-lb nginx -t
            docker compose $FILES restart ai-lb
          fi

      - name: 헬스체크
        run: |
          URL="${{ vars.PUBLIC_URL || 'https://artifact-prod.duckdns.org' }}"
          echo "확인 대상: $URL (화면) · $URL/api/v1/auth/login (백엔드·DB)"

          # 화면(/)만 보면 안 된다. 화면은 nginx 가 바로 주므로 백엔드가 죽어 있어도 200 이다 — 2026-11-12 에는
          # 배포가 초록인데 로그인만 "서버에 연결할 수 없습니다"(502)였다. 그래서 백엔드와 DB 까지 가는 요청을 같이
          # 본다. 없는 아이디로 로그인하면 백엔드가 DB 를 조회한 뒤 400 을 준다(잠금·횟수 제한 없음).
          #   4xx         → 백엔드와 DB 까지 닿았다
          #   502·503·504 → 앞단(nginx)이 백엔드에 닿지 못했다(아직 기동 중이거나 죽었다)
          #   500         → 백엔드는 떴지만 DB 등이 깨졌다
          # 백엔드 기동에 30초 이상 걸린다(DataInitializer 가 KCD/약품 마스터를 적재).
          for i in $(seq 1 40); do
            # 연결이 안 되면 curl 이 000 을 찍고 실패한다. || true 로 이 스크립트(bash -e)가 거기서 끝나지 않게 한다.
            page=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL") || true
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$URL/api/v1/auth/login" \
                    -H 'Content-Type: application/json' -d '{"loginId":"deploy-healthcheck","password":"-"}') || true
            if [ "$page" = "200" ] && [[ "$api" =~ ^4[0-9][0-9]$ ]]; then
              echo "✅ 배포 성공 (${i}회차 — 화면 $page, 백엔드 $api)"
              exit 0
            fi
            echo "  ... 화면 $page · 백엔드 $api (${i}/40)"
            sleep 5
          done

          echo "❌ 200초 안에 화면 200 과 백엔드 응답(4xx)을 함께 받지 못했습니다."
          cd ~/artifact
          COMPOSE="docker compose $COMPOSE_FILES"
          $COMPOSE ps

          # 백엔드는 떠 있는데 화면 서버가 못 닿는 경우 여기에 connect() failed 가 남는다.
          echo "--- 화면 서버(nginx) 최근 로그 ---"
          $COMPOSE logs --tail 20 frontend

          # 스키마 문제로 안 뜬 경우 원인 줄이 스택트레이스 수백 줄에 묻힌다.
          # Flyway·validate 관련 줄만 먼저 뽑아 무엇이 어긋났는지 바로 보이게 한다.
          echo "--- 스키마 관련 로그 ---"
          $COMPOSE logs backend 2>&1 \
            | grep -iE "flyway|schema-validation|migration|checksum" | tail -20 \
            || echo "(스키마 관련 줄 없음 — 다른 원인일 가능성이 높다)"

          echo "--- 최근 로그 ---"
          $COMPOSE logs --tail 50 backend
          exit 1

      # 빌드할 때마다 예전 이미지가 쌓인다. 30GB 디스크가 몇 주면 찬다.
      # 실패해도 배포 자체는 성공했으므로 결과에 영향을 주지 않는다.
      - name: 안 쓰는 이미지 정리
        if: always()
        continue-on-error: true
        run: docker image prune -f
