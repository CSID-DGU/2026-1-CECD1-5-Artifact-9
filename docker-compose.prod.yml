# =============================================
# Team Artifact — 운영(EC2) 오버라이드
# =============================================
# 이 파일은 단독으로 쓰지 않는다. 기본 파일 위에 덮어쓰는 방식이다:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 순서가 중요하다 — 뒤에 오는 파일이 이긴다.
# 적용 결과를 눈으로 확인하려면 up 대신 config 를 붙여본다:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config
#
# ---------------------------------------------
# 이 파일이 하는 일은 "밖에서 열리는 문"을 줄이는 것이다.
# ---------------------------------------------
# 로컬에서는 MySQL(3306)과 백엔드(8080)를 호스트에 열어두는 편이 편하다. DB 도구로 붙어보고
# Swagger 로 API 를 찔러볼 수 있으니까. 그런데 EC2 에서 그건 "인터넷 전체에 연다"는 뜻이다.
#
#   [로컬]  브라우저 → :3000 nginx → backend:8080 → mysql:3306
#                      + :8080 직접   + :3306 직접   ← 이 둘을 없앤다
#   [운영]  브라우저 → :80  nginx → backend:8080 → mysql:3306
#
# 컨테이너끼리는 여전히 도커 내부 네트워크로 통신하므로 앱 동작은 그대로다.
# 바깥에 남는 문은 nginx 하나뿐이 된다.
#
# ---------------------------------------------
# `!reset` 이 무엇인가
# ---------------------------------------------
# compose 는 파일을 합칠 때 ports 같은 목록을 **덮어쓰지 않고 이어 붙인다.** 그래서
# 그냥 `ports: []` 라고 쓰면 기본 파일의 "3306:3306" 이 그대로 살아남는다 — 흔한 함정이다.
# `!reset` 은 "앞 파일의 값을 지우라"는 뜻으로, Docker Compose v2.24 이상에서 동작한다.
# 버전 확인: docker compose version
# =============================================

services:

  mysql:
    # 호스트에 3306 을 열지 않는다. 열어두면 EC2 퍼블릭 IP 로 DB 에 바로 붙을 수 있다.
    # 보안그룹으로도 막을 수 있지만 실수 한 번이 곧 환자 데이터 전체 유출이라 애초에 닫는다.
    # DB 를 봐야 할 때는 SSH 로 들어가 아래를 쓴다:
    #   docker exec -it artifact-mysql mysql -u root -p artifact_db
    ports: !reset []

  backend:
    # 호스트에 8080 을 열지 않는다. 인증은 걸려 있지만 nginx 를 우회하는 두 번째 입구를
    # 굳이 남길 이유가 없다. 프론트의 nginx 가 /api/ 를 backend:8080 으로 프록시한다.
    ports: !reset []
    environment:
      # Swagger UI 끄기 — 전체 API 목록과 요청 형식을 그대로 보여주는 화면이다.
      SWAGGER_ENABLED: "false"
      # DEBUG 로그에는 요청 본문(환자 이름·연락처)이 섞인다. 운영에서는 INFO.
      LOG_LEVEL: "INFO"

  frontend:
    # 로컬은 3000 이지만 운영은 80 이어야 한다 — 사용자에게 주소창에 포트를 치게 할 수는 없다.
    # HTTPS(443) 를 붙이는 방법은 docs/ec2-deployment-guide.md 의 8단계 참고.
    #
    # 여기는 `!reset` 이 아니라 `!override` 다. 둘은 다르다:
    #   !reset    → 앞 파일의 값을 지운다 (대체값을 줄 수 없다)
    #   !override → 앞 파일의 값을 지우고 여기 적은 값으로 바꾼다
    # `!reset` 뒤에 목록을 적으면 목록이 통째로 무시돼 포트가 하나도 안 열린다.
    ports: !override
      - "80:80"
