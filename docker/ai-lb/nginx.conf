# =============================================
# AI 워커 로드밸런서 — backend 와 FastAPI 워커들 사이 (부스 구성에서만 뜬다)
# =============================================
#
#   키오스크 ×N → Caddy(443) → nginx(frontend) → backend:8080 → [ai-lb:8000] → fastapi ×2 (+ 다른 EC2)
#                                                                  ↑ 여기
#
# **바깥 입구가 아니다.** 도커 내부 네트워크에서만 보이고(expose 만, ports 없음) 인증도 걸지 않는다 — 백엔드가
# 붙여 보내는 X-Internal-Secret 헤더를 그대로 흘려보내면 각 워커가 검사한다(fastapi/main.py verify_internal_secret).
#
# 왜 로드밸런서인가 — 도커 DNS 라운드로빈으로는 안 된다
# ----------------------------------------------------
# compose 의 replicas 로 늘리면 도커 DNS 가 여러 IP 를 돌려주지만, 백엔드는 JDK HttpClient 하나를 공유하고
# (common/config/HttpClientConfig.java) 그 클라이언트는 keep-alive 연결을 풀에 둔다. 한 번 맺은 연결에 계속 붙어
# 요청이 워커 하나로 쏠린다. 컨테이너가 전부 Up 이고 헬스체크도 통과하는데 실제로는 하나만 일한다 — 부스에서
# 알아채기 가장 어려운 증상이다. 그래서 워커를 명시적으로 나열하고, 어디로 갔는지를 아래 로그에 남긴다.
# =============================================

# 도커 내장 DNS — 아래 server ... resolve 가 워커 주소를 10초마다 다시 찾는다(open source nginx 1.27.3+).
# 이것 없이 호스트명을 쓰면 nginx 는 켜질 때 찾은 IP 를 끝까지 쓴다. 배포가 워커만 새로 만들고 ai-lb 는 그대로
# 두면(fastapi 코드만 바뀐 배포) 옛 IP 로 보내, 워커 하나가 조용히 빠지거나 둘 다 빠져 AI 분석이 502 가 된다.
# 화면 서버(frontend/nginx.conf)가 backend 의 옛 IP 를 붙잡아 로그인이 502 가 됐던 것(2026-11-12)과 같은 문제다.
# 덤으로, 워커 컨테이너가 아직 없어도 ai-lb 가 뜬다(예전에는 host not found 로 죽었다).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

upstream ai_workers {
    # 바뀐 주소를 워커 프로세스들이 나눠 쓰는 공유 메모리 — resolve 를 쓰려면 있어야 한다.
    zone ai_workers 64k;

    # 라운드로빈이 아니라 least_conn 이다. 추론 시간이 요청마다 다르다(사진 크기·확대 재판정 여부·태스크).
    # 라운드로빈은 무거운 요청을 받은 워커에 다음 요청을 또 넣는다.
    least_conn;

    server fastapi:8000  resolve max_fails=3 fail_timeout=15s;
    server fastapi2:8000 resolve max_fails=3 fail_timeout=15s;
    # server fastapi3:8000 resolve max_fails=3 fail_timeout=15s;   # docker-compose.booth.yml 의 fastapi3 와 짝

    # 다른 EC2 의 AI 전용 워커(수평 확장). docker/ai-lb/remote.d/*.conf 에 서버 한 줄씩 둔다 — 예:
    #   server 172.31.12.34:8000 max_fails=3 fail_timeout=15s;
    # (사설 IP 를 그대로 적으므로 resolve 가 필요 없다)
    # 그 폴더의 .conf 는 git 이 무시하므로(배포의 git reset --hard 에도 지워지지 않는다) 서버에서 만들어 둔다.
    # 파일이 없으면 아무것도 붙지 않는다.
    include /etc/nginx/ai-lb.d/*.conf;

    # 워커당 유휴 연결을 유지해 요청마다 TCP 핸드셰이크를 하지 않는다(아래 proxy_http_version 1.1 + Connection "" 과 짝).
    keepalive 8;
    # uvicorn 은 5초 쉬는 연결을 끊는다(--timeout-keep-alive 기본값). 그보다 먼저 이쪽에서 놓아야, 막 끊긴 연결에
    # 요청을 실어 보내는 경합이 생기지 않는다.
    keepalive_timeout 4s;
}

# 어느 워커가 얼마나 걸렸는지 한 줄씩 남긴다 — 부스 준비의 핵심 확인 수단이다.
# 두 키오스크가 동시에 눌렀을 때 upstream 주소가 서로 달라야 분산되고 있는 것이다.
log_format ai_lb '$time_iso8601 upstream=$upstream_addr status=$upstream_status '
                 'req=$request_time upstream_time=$upstream_response_time';

server {
    listen 8000;
    access_log /var/log/nginx/access.log ai_lb;

    # ⚠️ 이 줄이 없으면 큰 사진이 413 으로 죽는다(nginx 기본 1MB). 백엔드는 사진을 base64 로 감싸 JSON 으로 보내므로
    # 본문이 원본의 약 1.34배다. 앞단 상한이 25MB 라 최악 34MB 가 온다. 진짜 상한은 앞단이 잡으므로 넉넉히 연다.
    # (키오스크는 올리기 전에 긴 변 2048px 로 줄이므로 평소에는 1MB 남짓이다 — frontend/src/utils/uploadImage.ts)
    client_max_body_size 64m;

    location / {
        proxy_pass http://ai_workers;

        # keepalive 를 쓰려면 둘 다 필요하다. HTTP/1.0 이나 Connection: close 면 upstream keepalive 가 조용히 무시된다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 본문을 통째로 받아 디스크에 쓴 뒤 넘기지 않고 흘려보낸다 — 워커가 바로 읽기 시작한다.
        proxy_request_buffering off;

        proxy_connect_timeout 3s;
        # backend 의 읽기 타임아웃(fastapi.timeout-seconds, 기본 30초)보다 넉넉히 둔다. **끊는 주체를 backend 하나로
        # 고정한다.** 여기가 더 짧으면 backend 는 정체불명의 502·504 를 받는다.
        proxy_read_timeout 60s;

        # 워커가 죽었거나 재기동 중일 때만 다른 워커로 넘긴다. timeout 은 넣지 않는다 — "그 워커가 바쁘다"는 뜻인데
        # 다른 워커로 다시 보내면 이미 버거운 상황에서 부하를 두 배로 만든다.
        # non_idempotent: nginx 는 POST 를 기본으로 다시 보내지 않는다. 추론은 아무것도 저장하지 않으므로(저장은
        # backend 가 응답을 받은 뒤에 한다) 연결 오류 때 다른 워커로 다시 보내도 안전하다.
        proxy_next_upstream error http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
