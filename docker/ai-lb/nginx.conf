# =============================================
# AI 워커 로드밸런서 — backend 와 FastAPI 워커들 사이
# =============================================
# 부하가 걸리는 경로에서 이 파일이 앉는 자리는 여기다:
#
#   아이패드 ×N → Caddy(443) → nginx(frontend) → backend:8080 → [ai-lb:8000] → fastapi ×3
#                                                                  ↑ 여기
#
# **바깥으로 나가는 입구가 아니다.** 도커 내부 네트워크에서만 보이고(expose 만 하고 ports 없음),
# 인증도 걸지 않는다 — 백엔드가 붙여 보내는 X-Internal-Secret 헤더를 그대로 흘려보내면
# 각 워커가 알아서 검사한다(fastapi/main.py 의 verify_internal_secret).
#
# ---------------------------------------------
# 왜 로드밸런서가 필요한가 — DNS 라운드로빈은 안 된다
# ---------------------------------------------
# compose 의 deploy.replicas 로 워커를 늘리면 도커 내장 DNS 가 fastapi 를 여러 IP 로 돌려준다.
# 그것만으로 분산될 것 같지만 아니다. 백엔드는 JDK HttpClient 를 **싱글턴 빈으로 공유**하고
# (backend common/config/HttpClientConfig.java), 이 클라이언트는 HTTP/1.1 keep-alive 커넥션을
# 풀에 유지한다. 그래서 한 번 맺은 커넥션에 계속 붙어 **요청이 워커 하나로 쏠린다.**
#
# 더 나쁜 것은 그 상태가 겉으로 안 보인다는 점이다. 컨테이너 3개가 전부 Up 이고 헬스체크도
# 통과하는데 실제로는 1개만 일한다 — 부스 현장에서 알아채기 가장 어려운 종류의 증상이다.
#
# 그래서 워커를 명시적으로 나열하고 nginx 를 앞에 세운다. 어디로 갔는지가 아래 access_log 에
# 그대로 찍히므로, 분산이 되는지 안 되는지를 눈으로 확인할 수 있다.
# =============================================

upstream ai_workers {
    # 라운드로빈(기본값)이 아니라 least_conn 이다.
    # 추론 시간이 요청마다 다르다 — 히트맵 오버레이를 원본 해상도로 그리기 때문에
    # 2400px 폰카메라 사진과 작은 이미지의 처리 시간이 몇 배씩 차이난다.
    # 라운드로빈은 그 차이를 모르고 순서대로 나눠주므로, 무거운 요청을 받은 워커에
    # 다음 요청이 또 들어간다.
    least_conn;

    server fastapi:8000  max_fails=3 fail_timeout=15s;
    server fastapi2:8000 max_fails=3 fail_timeout=15s;
    server fastapi3:8000 max_fails=3 fail_timeout=15s;

    # 워커당 유휴 커넥션을 유지한다. 요청마다 TCP 핸드셰이크를 새로 하지 않는다.
    # (아래 location 의 proxy_http_version 1.1 + Connection "" 과 반드시 짝이다)
    keepalive 8;
}

# 어느 워커가 얼마나 걸렸는지를 한 줄로 본다. 부스 준비의 핵심 검증 수단이다 —
# 두 키오스크가 동시에 눌렀을 때 upstream 주소가 서로 달라야 분산이 되고 있는 것이다.
log_format ai_lb '$time_iso8601 upstream=$upstream_addr status=$upstream_status '
                 'req=$request_time upstream_time=$upstream_response_time';

server {
    listen 8000;
    access_log /var/log/nginx/access.log ai_lb;

    # ⚠️ 이 줄이 없으면 큰 사진이 413 으로 죽는다. nginx 기본값은 1MB 다.
    #
    # 백엔드는 이미지를 base64 로 감싸 JSON 으로 보낸다(/predict-base64). base64 는 3바이트를
    # 4글자로 바꾸므로 본문이 원본의 약 1.34배가 된다. 업로드 상한이 25MB 이므로
    # (frontend/nginx.conf 의 client_max_body_size, docker/caddy/Caddyfile 의 max_size)
    # 최악의 경우 34MB 가 여기로 들어온다.
    #
    # 지금까지는 backend 가 fastapi 를 직접 불러서 중간에 크기 제한이 아예 없었다.
    # **이 파일이 새로 만드는 제약**이므로 넉넉히 열어둔다. 진짜 상한은 앞단(25MB)이 잡는다.
    client_max_body_size 64m;

    location / {
        proxy_pass http://ai_workers;

        # keepalive 를 쓰려면 둘 다 필요하다. HTTP/1.0 으로 나가거나 Connection: close 가
        # 붙으면 upstream 의 keepalive 지시어가 조용히 무시된다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 34MB 짜리 본문을 통째로 받아 디스크에 쓴 뒤에야 워커로 보내면 그만큼 지연이 붙는다.
        # (nginx 는 client_body_buffer_size 를 넘으면 임시파일로 떨어뜨린다 — 기본 16KB 다)
        # 흘려보내면 워커가 바로 읽기 시작한다.
        proxy_request_buffering off;

        proxy_connect_timeout 3s;

        # backend 의 읽기 타임아웃이 30초다(application.properties 의 fastapi.timeout-seconds).
        # 여기를 그보다 넉넉하게 두어 **끊는 주체를 backend 하나로 고정한다.**
        # 여기가 더 짧으면 backend 는 504 를, 사용자는 정체불명의 오류를 보게 된다.
        proxy_read_timeout 60s;

        # 워커가 죽었거나 재기동 중일 때만 다음 워커로 넘긴다.
        # **timeout 은 일부러 넣지 않았다.** 타임아웃은 "그 워커가 바쁘다"는 뜻인데,
        # 그걸 다른 워커로 재시도하면 이미 버거운 상황에서 부하를 2배로 만든다.
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
