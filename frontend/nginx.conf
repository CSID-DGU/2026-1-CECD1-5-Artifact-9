server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # 도커 내장 DNS. proxy_pass 에 호스트명(backend)을 그대로 쓰면 nginx 는 켜질 때 한 번 찾은 IP 를 끝까지 쓴다.
    # 배포가 backend 컨테이너만 새로 만들면(BOOTH_MODE 전환, .env 변경처럼 화면 코드는 그대로인 배포) backend 의
    # 내부 IP 가 바뀌는데, 이 컨테이너는 옛 IP 로 보내 /api 가 전부 502 가 된다 — 화면에는 "서버에 연결할 수
    # 없습니다". 2026-11-12 부스 구성 전환 때 실제로 겪었다. 아래 location /api/ 가 변수로 넘겨 요청 때 다시 찾는다.
    # valid=10s: 바뀐 주소를 10초 안에 따라간다. ipv6=off: 도커 네트워크는 IPv4 라 AAAA 조회로 시간을 쓰지 않는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files /index.html =404;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri =404;
    }

    # /api/ 요청을 Spring Boot 백엔드로 프록시
    # trailing slash 없음 → /api/v1/... 경로 그대로 backend:8080/api/v1/... 로 전달
    location /api/ {
        # 변수로 넘겨야 위 resolver 로 매번 다시 찾는다. 변수에 경로를 붙이지 않는다 — 그래야 지금처럼
        # 요청 경로(/api/v1/...)가 그대로 backend 로 간다.
        set $backend_upstream http://backend:8080;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: 파일이 없으면 index.html 반환 (React Router 대응)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
